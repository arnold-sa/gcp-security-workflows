name: Security - Trivy and Prowler scans

on:
  push:
  pull_request:

permissions:
  contents: read
  id-token: write
  security-events: write

jobs:
  trivy-filesystem-scan:
    uses: arnold-sa/gcp-security-workflows/.github/workflows/trivy-dev-filesystem-scan.yml@dev
    with:
      results_bucket: project_trivy_1
    secrets:
      WIF_PROVIDER: ${{ secrets.WIF_PROVIDER }}
      RESULTS_UPLOADER_SA: ${{ secrets.RESULTS_UPLOADER_SA }}

  prowler-gcp-scan:
    if: github.ref == 'refs/heads/main'
    uses: arnold-sa/gcp-security-workflows/.github/workflows/prowler-deploy-gcp-scan.yml@dev
    with:
      gcp_project_id: ${{ vars.GCP_PROJECT_ID }}
      results_bucket: project_trivy_1
    secrets:
      WIF_PROVIDER: ${{ secrets.WIF_PROVIDER }}
      PROWLER_SA: ${{ secrets.PROWLER_SA }}
      RESULTS_UPLOADER_SA: ${{ secrets.RESULTS_UPLOADER_SA }}
