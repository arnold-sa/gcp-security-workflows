name: Nmap - NETWORK scan

on:
  workflow_call:
    inputs:
      targets:
        description: CIDR range or newline/comma-separated target list to scan.
        required: true
        type: string
      results_bucket:
        description: GCS bucket name for durable scan result storage.
        required: true
        type: string
    secrets:
      WIF_PROVIDER:
        description: Workload Identity Provider resource name.
        required: true
      RESULTS_UPLOADER_SA:
        description: Service account with permission to create objects in the results bucket.
        required: true

jobs:
  nmap:
    name: Nmap service detection scan
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Nmap - Authenticate to GCP for result upload
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.RESULTS_UPLOADER_SA }}
          # This identity only needs bucket write access, such as roles/storage.objectCreator.

      - name: Nmap - Set up gcloud CLI
        uses: google-github-actions/setup-gcloud@v2

      - name: Nmap - Calculate GCS partition path
        id: partition
        shell: bash
        run: |
          # UTC keeps bucket partitions consistent across runner locations.
          echo "year=$(date -u +%Y)" >> "$GITHUB_OUTPUT"
          echo "month=$(date -u +%m)" >> "$GITHUB_OUTPUT"
          echo "day=$(date -u +%d)" >> "$GITHUB_OUTPUT"

      - name: Nmap - Install CLI
        run: sudo apt-get update && sudo apt-get install -y nmap

      - name: Nmap - Run service detection
        run: |
          mkdir -p nmap-results
          # Accept either comma-separated or newline-separated targets from the caller.
          printf '%s\n' '${{ inputs.targets }}' | tr ',' '\n' > nmap-results/targets.txt
          nmap -sV \
            -oX nmap-results/nmap.xml \
            -oN nmap-results/nmap.txt \
            -iL nmap-results/targets.txt

      - name: Nmap - Upload reports as GitHub artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nmap-${{ github.run_id }}
          path: nmap-results/
          if-no-files-found: warn
          retention-days: 14

      - name: Nmap - Upload reports to GCS
        if: always()
        run: |
          gcloud storage cp -r nmap-results/* \
            "gs://${{ inputs.results_bucket }}/year=${{ steps.partition.outputs.year }}/month=${{ steps.partition.outputs.month }}/day=${{ steps.partition.outputs.day }}/tool=nmap/run_id=${{ github.run_id }}/"
