name: Trivy - BUILD container image scan

on:
  workflow_call:
    inputs:
      image:
        description: Full image reference to scan before it is pushed to Artifact Registry.
        required: true
        type: string
      results_bucket:
        description: GCS bucket name for durable scan result storage.
        required: true
        type: string
    secrets:
      WIF_PROVIDER:
        description: Workload Identity Provider resource name.
        required: true
      RESULTS_UPLOADER_SA:
        description: Service account with permission to create objects in the results bucket.
        required: true
  workflow_dispatch:
    inputs:
      image:
        description: Full image reference to scan.
        required: true
        type: string
      results_bucket:
        description: GCS bucket name for durable scan result storage.
        required: true
        type: string

jobs:
  trivy-image:
    name: Trivy image scan
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write
      security-events: write

    steps:
      - name: Trivy - Authenticate to GCP for result upload
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.RESULTS_UPLOADER_SA }}
          # This identity only needs bucket write access, such as roles/storage.objectCreator.

      - name: Trivy - Resolve runtime inputs
        id: runtime
        shell: bash
        run: |
          RESULTS_BUCKET="${{ inputs.results_bucket }}"
          if [ -z "$RESULTS_BUCKET" ]; then
            echo "::error::results_bucket is empty. Pass it as an input."
            exit 1
          fi
          echo "results_bucket=$RESULTS_BUCKET" >> "$GITHUB_OUTPUT"

      - name: Trivy - Set up gcloud CLI
        uses: google-github-actions/setup-gcloud@v2

      - name: Trivy - Calculate GCS partition path
        id: partition
        shell: bash
        run: |
          # UTC keeps bucket partitions consistent across runner locations.
          echo "year=$(date -u +%Y)" >> "$GITHUB_OUTPUT"
          echo "month=$(date -u +%m)" >> "$GITHUB_OUTPUT"
          echo "day=$(date -u +%d)" >> "$GITHUB_OUTPUT"

      - name: Trivy - Prepare BUILD results directory
        run: mkdir -p build-results

      - name: Trivy - Run image scan as JSON
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ inputs.image }}
          format: json
          output: build-results/trivy-image.json
          exit-code: "0"
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - name: Trivy - Run image scan as SARIF
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ inputs.image }}
          format: sarif
          output: build-results/trivy-image.sarif
          exit-code: "0"
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - name: Trivy - Generate image HTML report
        if: always()
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const input = 'build-results/trivy-image.json';
          const output = 'build-results/trivy-image.html';

          if (!fs.existsSync(input)) {
            console.log(`${input} not found; skipping HTML report generation.`);
            process.exit(0);
          }

          const esc = (value) => String(value ?? '')
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#39;');

          const data = JSON.parse(fs.readFileSync(input, 'utf8'));
          const rows = [];

          for (const result of data.Results || []) {
            for (const item of result.Vulnerabilities || []) {
              rows.push({
                target: result.Target,
                id: item.VulnerabilityID,
                package: item.PkgName,
                severity: item.Severity,
                title: item.Title || item.Description,
                installed: item.InstalledVersion,
                fixed: item.FixedVersion,
              });
            }
          }

          const body = rows.length
            ? rows.map((row) => `
                <tr>
                  <td>${esc(row.severity)}</td>
                  <td>${esc(row.target)}</td>
                  <td>${esc(row.id)}</td>
                  <td>${esc(row.package)}</td>
                  <td>${esc(row.title)}</td>
                  <td>${esc(row.installed)}</td>
                  <td>${esc(row.fixed)}</td>
                </tr>`).join('')
            : '<tr><td colspan="7">No findings reported by Trivy.</td></tr>';

          fs.writeFileSync(output, `<!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <title>Trivy image report</title>
            <style>
              body { font-family: Arial, sans-serif; margin: 2rem; color: #17202a; }
              h1 { margin-bottom: 0.25rem; }
              table { border-collapse: collapse; width: 100%; margin-top: 1rem; }
              th, td { border: 1px solid #d5d8dc; padding: 0.5rem; text-align: left; vertical-align: top; }
              th { background: #f4f6f7; }
              td { font-size: 0.9rem; }
            </style>
          </head>
          <body>
            <h1>Trivy image report</h1>
            <p>Generated from ${esc(input)} for run ${esc(process.env.GITHUB_RUN_ID)}.</p>
            <table>
              <thead>
                <tr>
                  <th>Severity</th>
                  <th>Target</th>
                  <th>ID</th>
                  <th>Package</th>
                  <th>Title</th>
                  <th>Installed</th>
                  <th>Fixed</th>
                </tr>
              </thead>
              <tbody>${body}</tbody>
            </table>
          </body>
          </html>`);
          NODE

      - name: Trivy - Upload BUILD reports as GitHub artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-image-${{ github.run_id }}
          path: build-results/
          if-no-files-found: warn
          retention-days: 14

      - name: Trivy - Upload BUILD SARIF to GitHub code scanning
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: build-results/trivy-image.sarif
        continue-on-error: true

      - name: Trivy - Upload BUILD reports to GCS
        if: always()
        run: |
          gcloud storage cp -r build-results/* \
            "gs://${{ steps.runtime.outputs.results_bucket }}/year=${{ steps.partition.outputs.year }}/month=${{ steps.partition.outputs.month }}/day=${{ steps.partition.outputs.day }}/tool=trivy_image/run_id=${{ github.run_id }}/"
