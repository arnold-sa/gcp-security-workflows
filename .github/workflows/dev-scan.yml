name: DEV - Trivy filesystem scan

on:
  workflow_call:
    inputs:
      results_bucket:
        description: GCS bucket name for durable scan result storage.
        required: true
        type: string
    secrets:
      WIF_PROVIDER:
        description: Workload Identity Provider resource name.
        required: true
      RESULTS_UPLOADER_SA:
        description: Service account with permission to create objects in the results bucket.
        required: true

jobs:
  trivy-fs:
    name: Trivy filesystem, secret, and config scan
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to GCP for result upload
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.RESULTS_UPLOADER_SA }}
          # This identity only needs bucket write access, such as roles/storage.objectCreator.

      - name: Set up gcloud CLI
        uses: google-github-actions/setup-gcloud@v2

      - name: Calculate GCS partition path
        id: partition
        shell: bash
        run: |
          # UTC keeps bucket partitions consistent across runner locations.
          echo "year=$(date -u +%Y)" >> "$GITHUB_OUTPUT"
          echo "month=$(date -u +%m)" >> "$GITHUB_OUTPUT"
          echo "day=$(date -u +%d)" >> "$GITHUB_OUTPUT"

      - name: Prepare DEV results directory
        run: mkdir -p dev-results

      - name: Run Trivy filesystem scan as JSON
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          format: json
          output: dev-results/trivy-fs.json
          exit-code: "0"
          ignore-unfixed: true

      - name: Run Trivy filesystem scan as SARIF
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          format: sarif
          output: dev-results/trivy-fs.sarif
          # DEV gates on Trivy findings because issues are cheapest to fix before merge.
          exit-code: "1"
          ignore-unfixed: true

      - name: Run Trivy filesystem scan as HTML
        uses: aquasecurity/trivy-action@0.28.0
        if: always()
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          format: template
          template: "@/contrib/html.tpl"
          output: dev-results/trivy-fs.html
          exit-code: "0"
          ignore-unfixed: true

      - name: Upload DEV Trivy reports as GitHub artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-fs-${{ github.run_id }}
          path: dev-results/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload DEV SARIF to GitHub code scanning
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: dev-results/trivy-fs.sarif
        continue-on-error: true

      - name: Upload DEV Trivy reports to GCS
        if: always()
        run: |
          gcloud storage cp -r dev-results/* \
            "gs://${{ inputs.results_bucket }}/year=${{ steps.partition.outputs.year }}/month=${{ steps.partition.outputs.month }}/day=${{ steps.partition.outputs.day }}/tool=trivy_fs/run_id=${{ github.run_id }}/"
