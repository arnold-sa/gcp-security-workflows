name: Prowler - DEPLOY GCP scan

"on":
  workflow_call:
    inputs:
      gcp_project_id:
        description: GCP project ID to scan.
        required: true
        type: string
      results_bucket:
        description: GCS bucket name for durable scan result storage.
        required: true
        type: string
    secrets:
      WIF_PROVIDER:
        description: Workload Identity Provider resource name.
        required: true
      PROWLER_SA:
        description: Service account email Prowler uses to scan GCP configuration.
        required: true
      RESULTS_UPLOADER_SA:
        description: Service account with permission to create objects in the results bucket.
        required: true
  workflow_dispatch:
    inputs:
      gcp_project_id:
        description: GCP project ID to scan. Defaults to vars.GCP_PROJECT_ID when omitted.
        required: false
        type: string
      results_bucket:
        description: GCS bucket name for durable scan result storage. Defaults to vars.RESULTS_BUCKET when omitted.
        required: false
        type: string

jobs:
  prowler-gcp:
    name: Prowler GCP live configuration scan
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write
      security-events: write

    steps:
      - name: Prowler - Checkout code
        uses: actions/checkout@v4

      - name: Prowler - DEBUG check inputs and secrets
        shell: bash
        run: |
          echo "The Project ID variable is: '${{ inputs.gcp_project_id || vars.GCP_PROJECT_ID }}'"

          if [ -z "${{ secrets.PROWLER_SA }}" ]; then
            echo "::error::The PROWLER_SA secret is completely EMPTY! The caller repo is not passing it."
            exit 1
          else
            echo "The PROWLER_SA secret is successfully populated."
          fi

      - name: Prowler - Authenticate to GCP as scanner
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.PROWLER_SA }}
          # Prowler uses a read-oriented scanner identity to inspect live GCP configuration.

      - name: Prowler - Set up gcloud CLI
        uses: google-github-actions/setup-gcloud@v2

      - name: Prowler - Resolve runtime inputs
        id: runtime
        shell: bash
        run: |
          GCP_PROJECT_ID="${{ inputs.gcp_project_id }}"
          if [ -z "$GCP_PROJECT_ID" ]; then
            GCP_PROJECT_ID="${{ vars.GCP_PROJECT_ID }}"
          fi
          if [ -z "$GCP_PROJECT_ID" ]; then
            echo "::error::gcp_project_id is empty. Pass it as an input or set vars.GCP_PROJECT_ID."
            exit 1
          fi

          RESULTS_BUCKET="${{ inputs.results_bucket }}"
          if [ -z "$RESULTS_BUCKET" ]; then
            RESULTS_BUCKET="${{ vars.RESULTS_BUCKET }}"
          fi
          if [ -z "$RESULTS_BUCKET" ]; then
            echo "::error::results_bucket is empty. Pass it as an input or set vars.RESULTS_BUCKET."
            exit 1
          fi

          echo "gcp_project_id=$GCP_PROJECT_ID" >> "$GITHUB_OUTPUT"
          echo "results_bucket=$RESULTS_BUCKET" >> "$GITHUB_OUTPUT"

      - name: Prowler - Calculate GCS partition path
        id: partition
        shell: bash
        run: |
          # UTC keeps bucket partitions consistent across runner locations.
          echo "year=$(date -u +%Y)" >> "$GITHUB_OUTPUT"
          echo "month=$(date -u +%m)" >> "$GITHUB_OUTPUT"
          echo "day=$(date -u +%d)" >> "$GITHUB_OUTPUT"

      - name: Prowler - Validate required inputs
        shell: bash
        run: |
          if [ -z "${{ steps.runtime.outputs.gcp_project_id }}" ]; then
            echo "::error::gcp_project_id is empty. Set vars.GCP_PROJECT_ID or pass a workflow_dispatch input."
            exit 1
          fi

          if [ -z "${{ steps.runtime.outputs.results_bucket }}" ]; then
            echo "::error::results_bucket is empty. Set vars.RESULTS_BUCKET or pass a workflow_dispatch input."
            exit 1
          fi

      - name: Prowler - Show scanner identity and project context
        shell: bash
        run: |
          echo "Configured project: ${{ steps.runtime.outputs.gcp_project_id }}"
          echo "Active gcloud account:"
          gcloud auth list --filter=status:ACTIVE --format="value(account)"
          echo "Project visible to scanner:"
          gcloud projects describe "${{ steps.runtime.outputs.gcp_project_id }}" --format="value(projectId)"

      - name: Prowler - Install CLI
        run: |
          python -m pip install --upgrade prowler
          prowler --version

      - name: Prowler - Run GCP live configuration scan
        run: |
          mkdir -p prowler-results
          prowler gcp \
            --project-ids "${{ steps.runtime.outputs.gcp_project_id }}" \
            --output-directory prowler-results \
            --output-formats json-ocsf html csv \
            --status PASS FAIL MANUAL \
            || true
          # Include PASS, FAIL, and MANUAL so the reports show scan evidence even
          # when the scanner identity has no failed findings to report.

      - name: Prowler - Ensure result directory is not empty
        if: always()
        shell: bash
        run: |
          if ! find prowler-results -type f | grep -q .; then
            printf 'Prowler completed, but no report files were produced.\nProject: %s\nRun ID: %s\nExpected statuses: PASS, FAIL, MANUAL\n' \
              "${{ steps.runtime.outputs.gcp_project_id }}" \
              "${{ github.run_id }}" \
              > prowler-results/no-findings.txt
          fi

      - name: Prowler - Upload reports as GitHub artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prowler-${{ steps.runtime.outputs.gcp_project_id }}-${{ github.run_id }}
          path: prowler-results/
          if-no-files-found: warn
          retention-days: 14

      - name: Prowler - Authenticate to GCP as results uploader
        uses: google-github-actions/auth@v2
        if: always()
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.RESULTS_UPLOADER_SA }}
          # Switch back to the narrow bucket writer before storing results.

      - name: Prowler - Upload reports to GCS
        if: always()
        run: |
          # Clean up empty directories (like 'compliance/') that cause gcloud cp to crash
          find prowler-results -type d -empty -delete
          
          gcloud storage cp -r prowler-results/* \
            "gs://${{ steps.runtime.outputs.results_bucket }}/year=${{ steps.partition.outputs.year }}/month=${{ steps.partition.outputs.month }}/day=${{ steps.partition.outputs.day }}/tool=prowler/run_id=${{ github.run_id }}/"
