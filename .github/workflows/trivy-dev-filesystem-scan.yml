name: Trivy - DEV filesystem scan

on:
  workflow_call:
    inputs:
      results_bucket:
        description: GCS bucket name for durable scan result storage.
        required: true
        type: string
    secrets:
      WIF_PROVIDER:
        description: Workload Identity Provider resource name.
        required: true
      RESULTS_UPLOADER_SA:
        description: Service account with permission to create objects in the results bucket.
        required: true
  workflow_dispatch:
    inputs:
      results_bucket:
        description: GCS bucket name for durable scan result storage.
        required: true
        type: string

jobs:
  trivy-fs:
    name: Trivy filesystem, secret, and config scan
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write
      security-events: write

    steps:
      - name: Trivy - Checkout repository
        uses: actions/checkout@v4

      - name: Trivy - Authenticate to GCP for result upload
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.RESULTS_UPLOADER_SA }}

      - name: Trivy - Resolve runtime inputs
        id: runtime
        shell: bash
        run: |
          RESULTS_BUCKET="${{ inputs.results_bucket }}"
          if [ -z "$RESULTS_BUCKET" ]; then
            echo "::error::results_bucket is empty. Pass it as an input."
            exit 1
          fi
          echo "results_bucket=$RESULTS_BUCKET" >> "$GITHUB_OUTPUT"

      - name: Trivy - Set up gcloud CLI
        uses: google-github-actions/setup-gcloud@v2

      - name: Trivy - Calculate GCS partition path
        id: partition
        shell: bash
        run: |
          echo "year=$(date -u +%Y)" >> "$GITHUB_OUTPUT"
          echo "month=$(date -u +%m)" >> "$GITHUB_OUTPUT"
          echo "day=$(date -u +%d)" >> "$GITHUB_OUTPUT"

      - name: Trivy - Prepare DEV results directory
        run: mkdir -p dev-results

      - name: Trivy - Run filesystem scan as JSON
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          format: json
          output: dev-results/trivy-fs.json
          exit-code: "0"
          ignore-unfixed: true

      - name: Trivy - Run filesystem scan as SARIF
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          format: sarif
          output: dev-results/trivy-fs.sarif
          exit-code: "0"
          ignore-unfixed: true

      - name: Trivy - Generate filesystem HTML report
        if: always()
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const input = 'dev-results/trivy-fs.json';
          const output = 'dev-results/trivy-fs.html';

          if (!fs.existsSync(input)) {
            console.log(`${input} not found; skipping HTML report generation.`);
            process.exit(0);
          }

          const esc = (value) => String(value ?? '')
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#39;');

          const data = JSON.parse(fs.readFileSync(input, 'utf8'));
          const rows = [];

          for (const result of data.Results || []) {
            for (const item of result.Vulnerabilities || []) {
              rows.push({
                type: 'Vulnerability',
                target: result.Target,
                id: item.VulnerabilityID,
                package: item.PkgName,
                severity: item.Severity,
                title: item.Title || item.Description,
                installed: item.InstalledVersion,
                fixed: item.FixedVersion,
              });
            }

            for (const item of result.Misconfigurations || []) {
              rows.push({
                type: 'Misconfiguration',
                target: result.Target,
                id: item.ID,
                package: item.Type,
                severity: item.Severity,
                title: item.Title || item.Message,
                installed: item.Status,
                fixed: item.Resolution,
              });
            }

            for (const item of result.Secrets || []) {
              rows.push({
                type: 'Secret',
                target: result.Target,
                id: item.RuleID,
                package: item.Category,
                severity: item.Severity,
                title: item.Title,
                installed: item.StartLine ? `Line ${item.StartLine}` : '',
                fixed: '',
              });
            }
          }

          const body = rows.length
            ? rows.map((row) => `
                <tr>
                  <td>${esc(row.severity)}</td>
                  <td>${esc(row.type)}</td>
                  <td>${esc(row.target)}</td>
                  <td>${esc(row.id)}</td>
                  <td>${esc(row.package)}</td>
                  <td>${esc(row.title)}</td>
                  <td>${esc(row.installed)}</td>
                  <td>${esc(row.fixed)}</td>
                </tr>`).join('')
            : '<tr><td colspan="8">No findings reported by Trivy.</td></tr>';

          fs.writeFileSync(output, `<!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <title>Trivy filesystem report</title>
            <style>
              body { font-family: Arial, sans-serif; margin: 2rem; color: #17202a; }
              h1 { margin-bottom: 0.25rem; }
              table { border-collapse: collapse; width: 100%; margin-top: 1rem; }
              th, td { border: 1px solid #d5d8dc; padding: 0.5rem; text-align: left; vertical-align: top; }
              th { background: #f4f6f7; }
              td { font-size: 0.9rem; }
            </style>
          </head>
          <body>
            <h1>Trivy filesystem report</h1>
            <p>Generated from ${esc(input)} for run ${esc(process.env.GITHUB_RUN_ID)}.</p>
            <table>
              <thead>
                <tr>
                  <th>Severity</th>
                  <th>Type</th>
                  <th>Target</th>
                  <th>ID</th>
                  <th>Package / Category</th>
                  <th>Title</th>
                  <th>Installed / Status</th>
                  <th>Fixed / Resolution</th>
                </tr>
              </thead>
              <tbody>${body}</tbody>
            </table>
          </body>
          </html>`);
          NODE

      - name: Trivy - Upload DEV reports as GitHub artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-fs-${{ github.run_id }}
          path: dev-results/
          if-no-files-found: warn
          retention-days: 14

      - name: Trivy - Upload DEV SARIF to GitHub code scanning
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: dev-results/trivy-fs.sarif
        continue-on-error: true

      - name: Trivy - Upload DEV reports to GCS
        if: always()
        run: |
          gcloud storage cp -r dev-results/* \
            "gs://${{ steps.runtime.outputs.results_bucket }}/year=${{ steps.partition.outputs.year }}/month=${{ steps.partition.outputs.month }}/day=${{ steps.partition.outputs.day }}/tool=trivy_fs/run_id=${{ github.run_id }}/"
