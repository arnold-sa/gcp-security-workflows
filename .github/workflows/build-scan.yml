name: BUILD - Trivy container image scan

on:
  workflow_call:
    inputs:
      image:
        description: Full image reference to scan before it is pushed to Artifact Registry.
        required: true
        type: string
      results_bucket:
        description: GCS bucket name for durable scan result storage.
        required: true
        type: string
    secrets:
      WIF_PROVIDER:
        description: Workload Identity Provider resource name.
        required: true
      RESULTS_UPLOADER_SA:
        description: Narrowly scoped service account with roles/storage.objectCreator on the results bucket.
        required: true

jobs:
  trivy-image:
    name: Trivy image scan
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write
      security-events: write

    steps:
      - name: Authenticate to GCP for result upload
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.RESULTS_UPLOADER_SA }}
          # This upload identity is separate from scanner identities so its bucket
          # access can stay limited to object creation.

      - name: Set up gcloud CLI
        uses: google-github-actions/setup-gcloud@v2

      - name: Scan image and write SARIF
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ inputs.image }}
          format: sarif
          output: trivy-image.sarif
          exit-code: "1"
          severity: CRITICAL,HIGH
          # BUILD blocks only on high-impact image findings so lower-risk items can be
          # triaged without stopping every delivery.
          ignore-unfixed: true

      - name: Prepare BUILD results directory
        if: always()
        run: |
          mkdir -p build-results
          if [ -f trivy-image.sarif ]; then
            cp trivy-image.sarif build-results/trivy-image.sarif
          else
            printf 'Trivy SARIF was not produced.\n' > build-results/missing-output.txt
          fi

      - name: Upload Trivy SARIF as build artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-image-sarif-${{ github.sha }}
          path: trivy-image.sarif
          if-no-files-found: error

      - name: Upload BUILD results to GCS
        if: always()
        run: |
          gcloud storage cp -r build-results "gs://${{ inputs.results_bucket }}/build/${{ github.sha }}/"

      - name: Upload Trivy SARIF to GitHub code scanning
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-image.sarif
