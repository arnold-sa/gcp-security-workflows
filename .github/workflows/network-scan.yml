name: NETWORK - Nightly network scan

on:
  workflow_call:
    inputs:
      targets:
        description: CIDR range or newline/comma-separated target list to scan.
        required: true
        type: string
      results_bucket:
        description: GCS bucket name for durable scan result storage.
        required: true
        type: string
    secrets:
      WIF_PROVIDER:
        description: Workload Identity Provider resource name.
        required: true
      RESULTS_UPLOADER_SA:
        description: Narrowly scoped service account with roles/storage.objectCreator on the results bucket.
        required: true

jobs:
  network-scan:
    name: Nmap and OpenVAS placeholder scan
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Authenticate to GCP for result upload
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.RESULTS_UPLOADER_SA }}
          # Network scan results can expose sensitive service details, so uploads
          # use the same short-lived WIF pattern as the rest of the pipeline.

      - name: Set up gcloud CLI
        uses: google-github-actions/setup-gcloud@v2

      - name: Install Nmap
        run: sudo apt-get update && sudo apt-get install -y nmap

      - name: Run Nmap service detection
        run: |
          mkdir -p network-results
          printf '%s\n' '${{ inputs.targets }}' | tr ',' '\n' > network-results/targets.txt
          nmap -sV -oX network-results/nmap.xml -iL network-results/targets.txt
          # -sV records detected service versions. XML output is easier to ingest later
          # than terminal text if you want dashboards or diffing.

      - name: OpenVAS/GVM scan placeholder
        run: |
          mkdir -p network-results
          cat > network-results/openvas-placeholder.txt <<'EOF'
          OpenVAS/GVM integration belongs here.

          Typical implementations use gvm-cli or your organization's REST wrapper to:
          1. authenticate to an existing GVM/OpenVAS manager,
          2. create or update a target from the same targets input,
          3. start a scan task,
          4. poll until completion,
          5. export the report into this artifact directory.

          This workflow does not fabricate an API call because the endpoint, auth method,
          scanner ID, and report format are specific to your GVM deployment.
          EOF

      - name: Upload network scan artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: network-scan-${{ github.sha }}
          path: network-results/
          if-no-files-found: error

      - name: Upload NETWORK results to GCS
        if: always()
        run: |
          gcloud storage cp -r network-results "gs://${{ inputs.results_bucket }}/network/${{ github.sha }}/"
