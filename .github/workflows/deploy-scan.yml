name: DEPLOY - Prowler GCP scan

on:
  workflow_call:
    inputs:
      gcp_project_id:
        description: GCP project ID to scan.
        required: true
        type: string
      results_bucket:
        description: GCS bucket name for durable scan result storage.
        required: true
        type: string
    secrets:
      WIF_PROVIDER:
        description: Workload Identity Provider resource name.
        required: true
      PROWLER_SA:
        description: Service account email Prowler uses to scan GCP configuration.
        required: true
      RESULTS_UPLOADER_SA:
        description: Service account with permission to create objects in the results bucket.
        required: true

jobs:
  prowler-gcp:
    name: Prowler GCP live configuration scan
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write
      security-events: write

    steps:
      - name: Authenticate to GCP as Prowler scanner
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.PROWLER_SA }}
          # Prowler uses a read-oriented scanner identity to inspect live GCP configuration.

      - name: Set up gcloud CLI
        uses: google-github-actions/setup-gcloud@v2

      - name: Calculate GCS partition path
        id: partition
        shell: bash
        run: |
          # UTC keeps bucket partitions consistent across runner locations.
          echo "year=$(date -u +%Y)" >> "$GITHUB_OUTPUT"
          echo "month=$(date -u +%m)" >> "$GITHUB_OUTPUT"
          echo "day=$(date -u +%d)" >> "$GITHUB_OUTPUT"

      - name: Install Prowler
        run: python -m pip install --upgrade prowler

      - name: Run Prowler against the live GCP project
        run: |
          mkdir -p prowler-results
          prowler gcp \
            --project-ids "${{ inputs.gcp_project_id }}" \
            --output-directory prowler-results \
            --output-formats json-ocsf html csv \
            || true
          # Prowler is non-blocking here so live infrastructure findings can be triaged.

      - name: Upload Prowler reports as GitHub artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prowler-${{ inputs.gcp_project_id }}-${{ github.run_id }}
          path: prowler-results/
          if-no-files-found: warn
          retention-days: 14

      - name: Authenticate to GCP as results uploader
        uses: google-github-actions/auth@v2
        if: always()
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.RESULTS_UPLOADER_SA }}
          # Switch back to the narrow bucket writer before storing results.

      - name: Upload Prowler reports to GCS
        if: always()
        run: |
          gcloud storage cp -r prowler-results/* \
            "gs://${{ inputs.results_bucket }}/year=${{ steps.partition.outputs.year }}/month=${{ steps.partition.outputs.month }}/day=${{ steps.partition.outputs.day }}/tool=prowler/run_id=${{ github.run_id }}/"
